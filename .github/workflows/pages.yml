name: Publish OceanScope demo
on:
  workflow_dispatch:
  push:
    tags: ['demo-v*']
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify complete static release
        run: node scripts/verify-static-demo.mjs .
      - uses: actions/configure-pages@v5
      - name: Stage only manifested public files
        run: |
          python3 - <<'PY'
          import json,pathlib,shutil
          root=pathlib.Path('.')
          manifest=json.loads((root/'release-manifest.json').read_text())
          for name in [f['path'] for f in manifest['files']]+['release-manifest.json']:
              target=root/'_site'/name
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(root/name,target)
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
